<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classcastle Dev Labs</title>
  <link rel="icon" type="image/svg+xml" href="https://classcastle.org/logo.svg">
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #18221c;
      background: #fafbf8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(520px, 100%); text-align: center; }
    .logo { width: 56px; height: 56px; margin-bottom: 20px; }
    h1 { margin: 0 0 12px; font-size: clamp(1.7rem, 5vw, 2.2rem); letter-spacing: -.04em; }
    p { margin: 0 auto; color: #627067; line-height: 1.6; }
    .notice { margin-top: 20px; }
    button {
      margin-top: 24px;
      padding: 10px 16px;
      border: 1px solid #1f5c3a;
      border-radius: 5px;
      background: transparent;
      color: #1f5c3a;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #e7f2e8; }
    :focus-visible { outline: 3px solid #f4d35e; outline-offset: 3px; }
    .modal-backdrop { position: fixed; inset: 0; display: none; place-items: center; padding: 20px; background: rgba(15, 25, 18, .64); }
    .modal-backdrop.open { display: grid; }
    .modal { width: min(1040px, 100%); height: min(780px, 92vh); display: flex; flex-direction: column; overflow: hidden; border-radius: 8px; background: #fff; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid #dce3dc; }
    .modal-header strong { font-size: .95rem; }
    .close { margin: 0; padding: 4px 9px; border-color: #dce3dc; color: #18221c; }
    iframe { flex: 1; width: 100%; border: 0; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="https://classcastle.org/logo.svg" alt="Classcastle">
    <h1>Classcastle Dev Labs</h1>
    <p>We are building a new OAuth API for Classcastle. The current API is still available, but it is in maintenance mode and may not support newer features.</p>
    <button type="button" id="openDocs">View legacy API documentation</button>
  </main>

  <div class="modal-backdrop" id="docsModal" role="dialog" aria-modal="true" aria-labelledby="docsTitle" aria-hidden="true">
    <div class="modal">
      <div class="modal-header">
        <strong id="docsTitle">Legacy API documentation</strong>
        <button class="close" type="button" id="closeDocs" aria-label="Close legacy API documentation">×</button>
      </div>
      <iframe src="legacy-api.html" title="Legacy API documentation"></iframe>
    </div>
  </div>

  <script>
    const docsModal = document.getElementById('docsModal');
    const openDocs = document.getElementById('openDocs');
    const closeDocs = document.getElementById('closeDocs');

    function closeDocumentation() {
      docsModal.classList.remove('open');
      docsModal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      openDocs.focus();
    }

    openDocs.addEventListener('click', () => {
      docsModal.classList.add('open');
      docsModal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      closeDocs.focus();
    });
    closeDocs.addEventListener('click', closeDocumentation);
    docsModal.addEventListener('click', event => {
      if (event.target === docsModal) closeDocumentation();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && docsModal.classList.contains('open')) closeDocumentation();
    });
  </script>
</body>
</html>
