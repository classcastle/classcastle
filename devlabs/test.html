<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classcastle OAuth Experiment</title>
  <link rel="icon" type="image/svg+xml" href="https://classcastle.org/logo.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #18221c;
      background: #fafbf8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(520px, 100%); text-align: center; }
    .logo { width: 52px; height: 52px; margin-bottom: 20px; }
    h1 { margin: 0 0 12px; font-size: clamp(1.7rem, 5vw, 2.2rem); letter-spacing: -.04em; }
    p { margin: 0 auto; color: #627067; line-height: 1.6; }
    .panel { margin-top: 26px; padding: 24px; border: 1px solid #dce3dc; border-radius: 8px; background: #fff; }
    button {
      margin-top: 20px; padding: 11px 18px; border: 1px solid #1f5c3a;
      border-radius: 5px; background: #1f5c3a; color: #fff; font: inherit;
      font-weight: 600; cursor: pointer;
    }
    button:hover { background: #17462c; }
    button:disabled { opacity: .6; cursor: wait; }
    .status { min-height: 1.4em; margin-top: 16px; color: #627067; font-size: .84rem; }
    .status.error { color: #a33b3b; }
    .back { display: inline-block; margin-top: 22px; color: #1f5c3a; font-size: .86rem; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    :focus-visible { outline: 3px solid #f4d35e; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="https://classcastle.org/logo.svg" alt="Classcastle">
    <h1>Classcastle OAuth experiment</h1>
    <p>This experiment starts OAuth with the configured Supabase custom provider:</p>
    <div class="panel">
      <strong>custom:classcastle</strong>
      <br>
      <button type="button" id="startOAuth">Start OAuth</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </div>
    <a class="back" href="index.html">← Back to Dev Labs</a>
  </main>

  <script>
    const supabase = window.supabase.createClient(
      'https://hduyofdbpspjcuwvackd.supabase.co',
      'sb_publishable_zI1zwUpMhbnU1cMwRJBTug_or6athhK'
    );
    const startOAuth = document.getElementById('startOAuth');
    const status = document.getElementById('status');

    startOAuth.addEventListener('click', async () => {
      startOAuth.disabled = true;
      status.className = 'status';
      status.textContent = 'Starting OAuth…';

      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'custom:classcastle',
        options: {
          redirectTo: window.location.href
        }
      });

      if (error) {
        startOAuth.disabled = false;
        status.className = 'status error';
        status.textContent = error.message || 'Could not start OAuth.';
      }
    });
  </script>
</body>
</html>
