<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classcastle Extension</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F7F6F1;
      color: #1C1B17;
    }

    .container {
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #E2E0D6;
    }

    .logo {
      width: 32px;
      height: 32px;
    }

    .header h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .status {
      background: #E7EDE4;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .status.active {
      display: block;
    }

    .status h2 {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #2F5233;
    }

    .status p {
      font-size: 0.8rem;
      color: #6B6A61;
    }

    .status button {
      margin-top: 12px;
    }

    .form {
      display: block;
    }

    .form.hidden {
      display: none;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: #6B6A61;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #E2E0D6;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .form-group input:focus {
      border-color: #2F5233;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: #2F5233;
      color: white;
    }

    .btn-primary:hover {
      background: #254128;
    }

    .btn-primary:disabled {
      background: #6B6A61;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: white;
      color: #1C1B17;
      border: 1.5px solid #E2E0D6;
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background: #E2E0D6;
    }

    .error {
      background: #f5e0e0;
      color: #B23A2E;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }

    .error.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }

    .loading.show {
      display: block;
    }

    .loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #E2E0D6;
      border-top-color: #2F5233;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    .loading h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .loading p {
      font-size: 0.9rem;
      color: #6B6A61;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .instructions {
      font-size: 0.8rem;
      color: #6B6A61;
      line-height: 1.5;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #E2E0D6;
    }

    .instructions a {
      color: #2F5233;
      text-decoration: none;
    }

    .instructions a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img class="logo" src="icons/logo.svg" alt="Classcastle logo">
      <h1>Classcastle</h1>
    </div>

    <div class="status" id="status">
      <h2>✓ Connected to Room</h2>
      <p>Your browser is being managed by your teacher</p>
      <button class="btn btn-secondary" id="leaveBtn" style="margin-top: 12px;">Leave Room</button>
    </div>

    <div class="form" id="joinForm">
      <div class="form-group">
        <label for="roomId">Room ID</label>
        <input type="text" id="roomId" placeholder="Enter room ID from teacher">
      </div>

      <div class="form-group">
        <label for="studentName">Your Name</label>
        <input type="text" id="studentName" placeholder="e.g., John Doe">
      </div>

      <div class="error" id="error"></div>

      <button class="btn btn-primary" id="joinBtn">Join Room</button>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Joining room...</p>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <h2>Please wait a moment...</h2>
      <p>Continue in the opened window.</p>
      <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
    </div>

    <div class="instructions">
      Enter the room ID and your name provided by your teacher. Your browser will then follow the teacher's navigation instructions.
    </div>
  </div>

  <script src="supabase.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
