<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Classcastle icon</title>
  <desc>A flat green castle icon with an amber flag on the center tower.</desc>

  <g transform="translate(14,24)">
