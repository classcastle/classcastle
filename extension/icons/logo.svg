    <path d="M46 -28 L64 -22 L46 -16 Z" fill="#D98E2B"/>
    <!-- door -->
    <path d="M40 86 L40 66 Q40 58 46 58 Q52 58 52 66 L52 86 Z" fill="#F7F6F1"/>
