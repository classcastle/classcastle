    <rect x="0" y="34" width="92" height="52" rx="3" fill="#2F5233"/>
    <!-- crenellations -->
    <rect x="0" y="24" width="14" height="14" fill="#2F5233"/>
    <rect x="24" y="24" width="14" height="14" fill="#2F5233"/>
    <rect x="48" y="24" width="14" height="14" fill="#2F5233"/>
    <rect x="72" y="24" width="14" height="14" fill="#2F5233"/>
    <!-- left tower -->
    <rect x="-8" y="18" width="24" height="68" rx="2" fill="#264429"/>
    <rect x="-8" y="6" width="8" height="14" fill="#264429"/>
    <rect x="0" y="6" width="8" height="14" fill="#264429"/>
    <rect x="8" y="6" width="8" height="14" fill="#264429"/>
    <!-- right tower -->
    <rect x="76" y="18" width="24" height="68" rx="2" fill="#264429"/>
    <rect x="76" y="6" width="8" height="14" fill="#264429"/>
    <rect x="84" y="6" width="8" height="14" fill="#264429"/>
