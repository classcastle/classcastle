    <rect x="10" y="46" width="8" height="10" rx="1" fill="#F7F6F1"/>
    <rect x="66" y="46" width="8" height="10" rx="1" fill="#F7F6F1"/>
    <rect x="34" y="14" width="7" height="9" rx="1" fill="#F7F6F1"/>
