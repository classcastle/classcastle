<!DOCTYPE html>
<html>
<head>
  <title>Generate Extension Icons</title>
</head>
<body>
  <h1>Generate Extension Icons</h1>
  <p>Click the buttons below to download the icons</p>

  <button onclick="downloadIcon(16)">Download icon16.png</button>
  <button onclick="downloadIcon(48)">Download icon48.png</button>
  <button onclick="downloadIcon(128)">Download icon128.png</button>

  <script>
    function createIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Background
      ctx.fillStyle = '#2F5233';
      ctx.fillRect(0, 0, size, size);

      // Castle shape
      ctx.fillStyle = '#D98E2B';
      const padding = size * 0.2;
      const castleSize = size - (padding * 2);

      // Castle base
      ctx.fillRect(padding, size * 0.6, castleSize, size * 0.3);

      // Castle towers
      ctx.fillRect(padding, size * 0.3, size * 0.2, size * 0.4);
      ctx.fillRect(size - padding - (size * 0.2), size * 0.3, size * 0.2, size * 0.4);

      // Castle middle
      ctx.fillRect(padding + (size * 0.25), size * 0.4, size * 0.5, size * 0.3);

      return canvas.toDataURL('image/png');
    }

    function downloadIcon(size) {
      const dataUrl = createIcon(size);
      const link = document.createElement('a');
      link.download = `icon${size}.png`;
      link.href = dataUrl;
      link.click();
    }
  </script>
</body>
</html>
