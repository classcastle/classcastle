<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal - Classcastle</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" id="favicon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FCFCFA;
      --surface: #fff;
      --ink: #18221C;
      --soft: #5E675F;
      --line: #D9DDD3;
      --brand: #1F5C3A;
      --tint: #E4F1E6;
      --board: #17352A;
      --chalk: #F4D35E;
      --red: #B23A2E;
      --amber: #D98E2B;
      --sky: var(--brand);
      --sky-soft: var(--tint);
      color-scheme: light dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0F1511;
        --surface: #18211B;
        --ink: #EEF2EA;
        --soft: #9EAA9F;
        --line: #2A362D;
        --brand: #4DAA72;
        --tint: #1A2B20;
        --board: #1C4030;
        --chalk: #F4D35E;
        --red: #D2503F;
        --amber: #F0B84D;
        --sky: var(--brand);
        --sky-soft: var(--tint);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0F1511;
      --surface: #18211B;
      --ink: #EEF2EA;
      --soft: #9EAA9F;
      --line: #2A362D;
      --brand: #4DAA72;
      --tint: #1A2B20;
      --board: #1C4030;
      --chalk: #F4D35E;
      --red: #D2503F;
      --amber: #F0B84D;
      --sky: var(--brand);
      --sky-soft: var(--tint);
    }
    * { box-sizing: inherit; }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Instrument Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 32px;
      flex: 1;
    }

    .logo {
      font-family: 'Young Serif', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--brand);
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo svg {
      width: 24px;
      height: 24px;
    }

    h1 {
      font-family: 'Young Serif', serif;
      font-size: 2rem;
      letter-spacing: -0.015em;
      margin-bottom: 16px;
      color: var(--ink);
    }

    p {
      color: var(--soft);
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .option-card {
      background: var(--surface);
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .option-card:hover {
      border-color: var(--brand);
      transform: translateY(-2px);
    }

    .option-icon {
      width: 48px;
      height: 48px;
      background: var(--tint);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .option-icon svg {
      width: 24px;
      height: 24px;
      color: var(--brand);
    }

    .option-title {
      font-family: 'Young Serif', serif;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .option-desc {
      font-size: 0.9rem;
      color: var(--soft);
    }

    .btn {
      padding: 12px 24px;
      border-radius: 6px;
      font-family: 'Instrument Sans', sans-serif;
      font-weight: 400;
      font-size: 0.98rem;
      cursor: pointer;
      transition: opacity 0.15s ease;
      border: none;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: var(--brand);
      color: var(--surface);
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .btn-secondary:hover {
      background: var(--line);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
      </svg>
      Classcastle
    </div>

    <h1>Legal Documents</h1>
    <p>Please select the legal document you would like to view:</p>

    <div class="options">
      <div class="option-card" onclick="window.location.href='/terms.html'">
        <div class="option-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" x2="8" y1="13" y2="13"></line>
            <line x1="16" x2="8" y1="17" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div class="option-title">Terms of Service</div>
        <div class="option-desc">Our terms and conditions for using Classcastle</div>
      </div>

      <div class="option-card" onclick="window.location.href='/privacy.html'">
        <div class="option-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <div class="option-title">Privacy Policy</div>
        <div class="option-desc">How we collect, use, and protect your data</div>
      </div>
    </div>

    <div style="text-align: center; margin-top: 32px;">
      <a href="/app.html" class="btn btn-secondary">Back to Dashboard</a>
    </div>
  </div>
</body>
</html>
