<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal - Classcastle</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" id="favicon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #ffffff;
      --ink: #1a1a1a;
      --ink-soft: #666666;
      --green: #22c55e;
      --line: #e5e5e5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f5f5f5;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 32px;
      flex: 1;
    }

    .logo {
      font-family: 'Fraunces', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--green);
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: -0.015em;
      margin-bottom: 16px;
    }

    p {
      color: var(--ink-soft);
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .option-card {
      background: #f9f9f9;
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .option-card:hover {
      border-color: var(--green);
      transform: translateY(-2px);
    }

    .option-icon {
      width: 48px;
      height: 48px;
      background: var(--green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .option-icon svg {
      width: 24px;
      height: 24px;
      color: white;
    }

    .option-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .option-desc {
      font-size: 0.9rem;
      color: var(--ink-soft);
    }

    .btn {
      padding: 12px 24px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.98rem;
      cursor: pointer;
      transition: opacity 0.15s ease;
      border: none;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: var(--green);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: white;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .btn-secondary:hover {
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
      </svg>
      Classcastle
    </div>

    <div class="card">
      <h1>Legal Documents</h1>
      <p>Please select the legal document you would like to view:</p>

      <div class="options">
        <div class="option-card" onclick="window.location.href='/terms.html'">
          <div class="option-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" x2="8" y1="13" y2="13"></line>
              <line x1="16" x2="8" y1="17" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </div>
          <div class="option-title">Terms of Service</div>
          <div class="option-desc">Our terms and conditions for using Classcastle</div>
        </div>

        <div class="option-card" onclick="window.location.href='/privacy.html'">
          <div class="option-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <div class="option-title">Privacy Policy</div>
          <div class="option-desc">How we collect, use, and protect your data</div>
        </div>
      </div>
    </div>

    <div style="text-align: center; margin-top: 24px;">
      <a href="/app.html" class="btn btn-secondary">Back to Dashboard</a>
    </div>
  </div>
</body>
</html>
