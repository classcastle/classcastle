<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classcastle — Teacher Login</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #F7F6F1;
    --ink: #1C1B17;
    --ink-soft: #6B6A61;
    --line: #E2E0D6;
    --green: #2F5233;
    --green-soft: #E7EDE4;
    --amber: #D98E2B;
    --red: #B23A2E;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1C1B17;
      --ink: #F7F6F1;
      --ink-soft: #B8B7AE;
      --line: #3A3930;
      --green: #E7EDE4;
      --green-soft: #2F5233;
      --amber: #F0B84D;
      --red: #E86A5E;
    }
  }
  * { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; padding: 0; min-height: 100vh; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; margin: 0; font-weight: 500; }
  p { margin: 0; }
  a { color: inherit; }

  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 28px 32px;
    max-width: 1080px; margin: 0 auto; width: 100%;
  }
  .wordmark { font-family: 'Fraunces', serif; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 9px; }
  .logo-mark { width: 24px; height: 24px; display: block; }
  .wordmark .word-accent { color: var(--green); }
  .nav-link {
    font-size: 0.88rem; font-weight: 500; color: var(--ink-soft);
    text-decoration: none;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  .auth-container {
    width: 100%;
    max-width: 420px;
  }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 40px 36px 32px;
  }

  .page-header {
    text-align: center;
    margin-bottom: 32px;
  }

  .page-title {
    font-size: clamp(1.5rem, 4vw, 1.8rem);
    letter-spacing: -0.01em;
    margin-bottom: 8px;
  }

  .page-subtitle {
    color: var(--ink-soft);
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-label {
    display: block;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .form-input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.98rem;
    background: var(--paper);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .form-input:focus {
    border-color: var(--green);
    background: #fff;
  }

  .btn {
    padding: 12px 24px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.98rem;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
    border: none;
  }
  .btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  .btn:not(:disabled):active {
    transform: scale(0.98);
  }

  .btn-primary {
    background: var(--green);
    color: #fff;
  }

  .btn-full {
    width: 100%;
  }

  .auth-footer {
    margin-top: 16px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }
  .auth-footer a {
    color: var(--green);
    text-decoration: none;
  }

  .notification {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--ink);
    color: var(--paper);
    padding: 16px 20px;
    border-radius: 8px;
    font-size: 0.92rem;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
    z-index: 1000;
  }
  .notification.show {
    opacity: 1;
    transform: translateY(0);
  }

  .loading {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid var(--paper);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 780px) {
    nav { padding: 22px 24px; }
    main { padding: 24px; }
  }
</style>
</head>
<body>

<nav>
  <div class="wordmark"><img src="/logo.svg" alt="" class="logo-mark"><span class="word-text">Class<span class="word-accent">castle</span></span></div>
  <a class="nav-link" href="/">Back to home</a>
</nav>

<main>
  <div class="auth-container">
    <div class="card">
      <div class="page-header">
        <h1 class="page-title">Welcome to Classcastle</h1>
        <p class="page-subtitle">Teacher account required to manage classrooms</p>
      </div>
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email</label>
        <input type="email" class="form-input" id="loginEmail" placeholder="you@school.edu">
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <input type="password" class="form-input" id="loginPassword" placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-full" id="loginBtn">
        <span class="btn-text">Sign in</span>
        <span class="loading" style="display: none;"></span>
      </button>
      <div class="auth-footer">
        New teacher? <a href="/signup.html">Create your account</a>
      </div>
      <div class="auth-footer" style="margin-top: 12px; font-size: 0.85rem;">
        By signing in, you agree to our <a href="/terms.html">Terms of Service</a> and <a href="/privacy.html">Privacy Policy</a>
      </div>
    </div>
  </div>
</main>

<div class="notification" id="notification"></div>

<script>
  // Supabase configuration
  const SUPABASE_URL = 'https://hduyofdbpspjcuwvackd.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_zI1zwUpMhbnU1cMwRJBTug_or6athhK';
  
  const SupabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Switch favicon based on theme
  function updateFavicon() {
    const favicon = document.getElementById('favicon');
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    favicon.href = isDark ? '/logo-dark.svg' : '/logo.svg';
  }

  // Update favicon on load and when theme changes
  updateFavicon();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateFavicon);

  const notification = document.getElementById('notification');
  const loginEmail = document.getElementById('loginEmail');
  const loginPassword = document.getElementById('loginPassword');
  const loginBtn = document.getElementById('loginBtn');
  const loginBtnText = loginBtn.querySelector('.btn-text');
  const loginBtnLoading = loginBtn.querySelector('.loading');

  function showNotification(message, duration = 3000) {
    notification.textContent = message;
    notification.classList.add('show');
    setTimeout(() => {
      notification.classList.remove('show');
    }, duration);
  }

  // Check if already logged in
  async function checkSession() {
    const { data: { session } } = await SupabaseClient.auth.getSession();
    
    if (session) {
      showNotification('You are already logged in!');
      setTimeout(() => {
        window.location.href = '/app.html';
      }, 500);
    }
  }

  async function handleLogin() {
    const email = loginEmail.value.trim();
    const password = loginPassword.value;

    if (!email || !password) {
      showNotification('Please fill in all fields');
      return;
    }

    // Show loading state
    loginBtn.disabled = true;
    loginBtnText.style.display = 'none';
    loginBtnLoading.style.display = 'inline-block';

    try {
      const { data, error } = await SupabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      showNotification('Welcome back, teacher!');
      setTimeout(() => {
        window.location.href = '/app.html';
      }, 1000);
    } catch (error) {
      showNotification(error.message);
      // Reset button state
      loginBtn.disabled = false;
      loginBtnText.style.display = 'inline';
      loginBtnLoading.style.display = 'none';
    }
  }

  loginBtn.addEventListener('click', handleLogin);
  loginPassword.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleLogin();
  });

  // Check if already logged in on page load
  checkSession();
</script>

</body>
</html>
