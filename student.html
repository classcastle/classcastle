<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classcastle - Student Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FCFCFA;
      --surface: #FFFFFF;
      --ink: #18221C;
      --soft: #5E675F;
      --line: #D9DDD3;
      --brand: #1F5C3A;
      --brand-ink: #FFFFFF;
      --tint: #E4F1E6;
      --red: #DC4444;
      --amber: #F59E0B;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--ink);
    }

    .logo svg {
      width: 40px;
      height: 40px;
    }

    .logo-text {
      font-size: 1.75rem;
      font-weight: 600;
    }

    .logout-btn {
      padding: 10px 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--soft);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      border-color: var(--brand);
      color: var(--brand);
      background: var(--tint);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }

    .stat-card h3 {
      font-size: 0.9rem;
      color: var(--soft);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .stat-card .value {
      font-size: 2.5rem;
      font-weight: 600;
      color: var(--brand);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .info-item {
      padding: 16px;
      background: var(--bg);
      border-radius: 8px;
      border: 1px solid var(--line);
    }

    .info-label {
      font-size: 0.85rem;
      color: var(--soft);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .info-value {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .info-value.large {
      font-size: 2rem;
      color: var(--brand);
    }

    .announcement-item {
      padding: 20px;
      background: var(--bg);
      border-radius: 8px;
      border: 1px solid var(--line);
      margin-bottom: 16px;
    }

    .announcement-item:last-child {
      margin-bottom: 0;
    }

    .announcement-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .announcement-message {
      color: var(--soft);
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .announcement-date {
      font-size: 0.85rem;
      color: var(--soft);
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--soft);
    }

    .empty-state svg {
      width: 72px;
      height: 72px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    .empty-state p {
      font-size: 1rem;
    }

    .loading {
      text-align: center;
      padding: 80px 20px;
      color: var(--soft);
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--line);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .notification {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--ink);
      color: var(--brand-ink);
      padding: 14px 28px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
      font-weight: 500;
    }

    .notification.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px 16px;
      }

      .header {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
      }

      .logout-btn {
        width: 100%;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="/" class="logo">
        <svg viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="var(--brand)"/>
          <path d="M8 16L13 21L24 10" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="logo-text">Classcastle</span>
      </a>
      <button class="logout-btn" id="logoutBtn">Sign out</button>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Loading your dashboard...</p>
    </div>

    <div id="content" style="display: none;">
      <div class="dashboard-grid">
        <div class="stat-card">
          <h3>Your Points</h3>
          <div class="value" id="studentPoints">0</div>
        </div>
        <div class="stat-card">
          <h3>School</h3>
          <div class="value" id="studentSchoolStat" style="font-size: 1.5rem;">-</div>
        </div>
      </div>

      <div class="card">
        <h2>Your Information</h2>
        <div class="info-grid">
          <div class="info-item">
            <div class="info-label">Name</div>
            <div class="info-value" id="studentName">-</div>
          </div>
          <div class="info-item">
            <div class="info-label">Email</div>
            <div class="info-value" id="studentEmail">-</div>
          </div>
          <div class="info-item">
            <div class="info-label">School</div>
            <div class="info-value" id="studentSchool">-</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Announcements from Your Teacher</h2>
        <div id="announcementsSection">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 5.882V19.24a1.76 1.76 0 0 1-3.417.592l-2.147-6.15M18 13a3 3 0 1 0 0-6M7.436 13.683A4.001 4.001 0 0 1 7 12a4 4 0 0 1 4-4h5"/>
            </svg>
            <p>No announcements from your teacher yet.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="notification" id="notification"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://hduyofdbpspjcuwvackd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_zI1zwUpMhbnU1cMwRJBTug_or6athhK';

    const SupabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function showNotification(message, duration = 3000) {
      const notification = document.getElementById('notification');
      notification.textContent = message;
      notification.classList.add('show');
      setTimeout(() => notification.classList.remove('show'), duration);
    }

    async function loadDashboard() {
      try {
        const { data: { user }, error } = await SupabaseClient.auth.getUser();

        if (error || !user) {
          window.location.href = '/oauth/student/login.html';
          return;
        }

        // Check if user is a student
        const userType = user.user_metadata?.user_type;
        if (userType !== 'student') {
          await SupabaseClient.auth.signOut();
          showNotification('Please use the student login page');
          window.location.href = '/oauth/student/login.html';
          return;
        }

        // Display user info
        document.getElementById('studentName').textContent = user.user_metadata?.name || '-';
        document.getElementById('studentEmail').textContent = user.email || '-';
        document.getElementById('studentSchool').textContent = user.user_metadata?.school_name || '-';
        document.getElementById('studentSchoolStat').textContent = user.user_metadata?.school_name || '-';

        // Load student points
        loadStudentPoints(user.id);

        // Load announcements
        loadAnnouncements(user.user_metadata?.school_name);

        // Hide loading, show content
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

      } catch (error) {
        console.error('Error loading dashboard:', error);
        showNotification('Error loading dashboard');
        window.location.href = '/oauth/student/login.html';
      }
    }

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await SupabaseClient.auth.signOut();
      window.location.href = '/oauth/student/login.html';
    });

    async function loadStudentPoints(studentId) {
      try {
        const { data, error } = await SupabaseClient.rpc('get_student_points', {
          p_student_id: studentId
        });

        if (error) throw error;

        document.getElementById('studentPoints').textContent = data || 0;
      } catch (error) {
        console.error('Error loading points:', error);
        document.getElementById('studentPoints').textContent = '-';
      }
    }

    async function loadAnnouncements(schoolName) {
      if (!schoolName) return;

      const announcementsSection = document.getElementById('announcementsSection');

      try {
        const { data, error } = await SupabaseClient.rpc('get_student_announcements');

        if (error) throw error;

        if (!data || data.length === 0) {
          announcementsSection.innerHTML = `
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 5.882V19.24a1.76 1.76 0 0 1-3.417.592l-2.147-6.15M18 13a3 3 0 1 0 0-6M7.436 13.683A4.001 4.001 0 0 1 7 12a4 4 0 0 1 4-4h5"/>
              </svg>
              <p>No announcements from your teacher yet.</p>
            </div>
          `;
        } else {
          announcementsSection.innerHTML = data.map(ann => `
            <div class="announcement-item">
              <div class="announcement-title">${ann.title}</div>
              <div class="announcement-message">${ann.message}</div>
              <div class="announcement-date">${new Date(ann.created_at).toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div>
            </div>
          `).join('');
        }
      } catch (error) {
        console.error('Error loading announcements:', error);
      }
    }

    // Load dashboard on page load
    loadDashboard();
  </script>
</body>
</html>
