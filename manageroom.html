<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classcastle — Manage Room</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/modal.js"></script>
<style>
  :root {
    --paper: #F7F6F1;
    --ink: #1C1B17;
    --ink-soft: #6B6A61;
    --line: #E2E0D6;
    --green: #2F5233;
    --green-soft: #E7EDE4;
    --amber: #D98E2B;
    --red: #B23A2E;
    --blue: #3B82F6;
    --blue-light: #E0E7FF;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1C1B17;
      --ink: #F7F6F1;
      --ink-soft: #B8B7AE;
      --line: #3A3930;
      --green: #E7EDE4;
      --green-soft: #2F5233;
      --amber: #F0B84D;
      --red: #E86A5E;
      --blue: #60A5FA;
      --blue-light: #1E3A5F;
    }
  }
  * { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; margin: 0; font-weight: 500; }
  p { margin: 0; }
  a { color: inherit; }

  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 32px;
    max-width: 1080px; margin: 0 auto;
  }
  .wordmark { font-family: 'Fraunces', serif; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 9px; }
  .logo-mark { width: 24px; height: 24px; display: block; }
  .wordmark .word-accent { color: var(--green); }
  .nav-link {
    font-size: 0.88rem; font-weight: 500; color: var(--ink-soft);
    text-decoration: none;
  }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 32px; }

  .container {
    display: flex;
    gap: 32px;
    margin-top: 32px;
  }

  .main-panel {
    flex: 1;
  }

  .side-panel {
    width: 320px;
  }

  .room-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 40px;
    text-align: center;
    margin-bottom: 24px;
  }

  .room-code-display {
    font-family: 'Fraunces', serif;
    font-size: 4rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--green);
    margin: 24px 0;
    line-height: 1;
  }

  .room-label {
    font-size: 0.95rem;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .btn {
    padding: 14px 32px;
    border: none;
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-primary {
    background: var(--green);
    color: #fff;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(47, 82, 51, 0.3);
  }

  .btn-secondary {
    background: var(--line);
    color: var(--ink);
  }
  .btn-secondary:hover {
    background: var(--ink-soft);
  }

  .btn-danger {
    background: var(--red);
    color: #fff;
  }
  .btn-danger:hover {
    background: #8B2E28;
  }

  .btn-small {
    padding: 8px 16px;
    font-size: 0.9rem;
  }

  .students-section {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px;
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .section-title {
    font-size: 1.4rem;
    letter-spacing: -0.01em;
  }

  .student-count {
    font-size: 0.95rem;
    color: var(--ink-soft);
    background: var(--green-soft);
    padding: 6px 12px;
    border-radius: 20px;
  }

  .student-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .student-item {
    display: flex;
    align-items: center;
    padding: 16px 20px;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
  }

  .student-item:hover {
    border-color: var(--red);
    background: #f5e0e0;
  }

  .student-item:hover .student-name {
    text-decoration: line-through;
    color: var(--red);
  }

  .student-name {
    font-size: 1rem;
    font-weight: 500;
    flex: 1;
    transition: all 0.2s ease;
  }

  .student-status {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--line);
    margin-left: 12px;
  }

  .student-item.online .student-status {
    background: var(--green);
  }

  .management-panel {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px;
    display: none;
  }

  .management-panel.active {
    display: block;
  }

  .control-group {
    margin-bottom: 24px;
  }

  .control-label {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 8px;
    display: block;
  }

  .url-input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.98rem;
    background: var(--paper);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .url-input:focus {
    border-color: var(--green);
    background: #fff;
  }

  .control-actions {
    display: flex;
    gap: 12px;
  }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--ink-soft);
  }
  .empty-state h3 {
    font-size: 1.1rem;
    margin-bottom: 8px;
  }
  .empty-state p {
    font-size: 0.92rem;
    line-height: 1.5;
  }

  .notification {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--ink);
    color: var(--paper);
    padding: 16px 20px;
    border-radius: 8px;
    font-size: 0.92rem;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
    z-index: 1000;
  }
  .notification.show {
    opacity: 1;
    transform: translateY(0);
  }

  .loading {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid var(--paper);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 900px) {
    .container {
      flex-direction: column;
    }
    .side-panel {
      width: 100%;
    }
  }

  @media (max-width: 780px) {
    nav { padding: 22px 24px; }
    .wrap { padding: 24px; }
    .room-code-display {
      font-size: 3rem;
    }
  }
</style>
</head>
<body>

<nav>
  <div class="wordmark"><img src="/logo.svg" alt="" class="logo-mark"><span class="word-text">Class<span class="word-accent">castle</span></span></div>
  <a class="nav-link" href="/app.html">Back to dashboard</a>
</nav>

<div class="wrap">
  <div class="container">
    <div class="main-panel">
      <div class="room-card">
        <p class="room-label">Room Code</p>
        <div class="room-code-display" id="roomCode">---</div>
        <button class="btn btn-primary" id="startBtn">
          <span class="btn-text">Start</span>
        </button>
      </div>

      <div class="students-section">
        <div class="section-header">
          <h2 class="section-title">Students</h2>
          <span class="student-count" id="studentCount">0 joined</span>
        </div>
        <div class="student-list" id="studentList">
          <div class="empty-state">
            <h3>No students yet</h3>
            <p>Share your room code with students. They'll appear here once they join with the Classcastle extension.</p>
          </div>
        </div>
      </div>
    </div>

    <div class="side-panel">
      <div class="management-panel" id="managementPanel">
        <h3 style="margin-bottom: 20px;">Room Controls</h3>

        <div class="control-group">
          <label class="control-label">Navigate Students</label>
          <input type="url" class="url-input" id="urlInput" placeholder="Enter URL (e.g., https://microbit.org)">
          <div class="control-actions" style="margin-top: 12px;">
            <button class="btn btn-primary btn-small" id="goBtn" disabled>
              <span class="btn-text">Go</span>
              <span class="loading" style="display: none;"></span>
            </button>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label">Room Actions</label>
          <div class="control-actions">
            <button class="btn btn-secondary btn-small" id="closeRoomBtn">Close</button>
            <button class="btn btn-secondary btn-small" id="reopenRoomBtn" style="display: none;">Reopen</button>
            <button class="btn btn-danger btn-small" id="deleteRoomBtn">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="notification" id="notification"></div>

<script>
  // Supabase configuration
  const SUPABASE_URL = 'https://hduyofdbpspjcuwvackd.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_zI1zwUpMhbnU1cMwRJBTug_or6athhK';

  const SupabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Switch favicon based on theme
  function updateFavicon() {
    const favicon = document.getElementById('favicon');
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    favicon.href = isDark ? '/logo-dark.svg' : '/logo.svg';
  }

  // Update favicon on load and when theme changes
  updateFavicon();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateFavicon);

  // Get room code from URL
  const urlParams = new URLSearchParams(window.location.search);
  const roomCode = urlParams.get('room');

  const notification = document.getElementById('notification');
  const roomCodeEl = document.getElementById('roomCode');
  const startBtn = document.getElementById('startBtn');
  const managementPanel = document.getElementById('managementPanel');
  const studentList = document.getElementById('studentList');
  const studentCount = document.getElementById('studentCount');
  const urlInput = document.getElementById('urlInput');
  const goBtn = document.getElementById('goBtn');
  const closeRoomBtn = document.getElementById('closeRoomBtn');
  const reopenRoomBtn = document.getElementById('reopenRoomBtn');
  const deleteRoomBtn = document.getElementById('deleteRoomBtn');

  let currentRoom = null;
  let currentUser = null;
  let students = [];
  let isStarted = false;

  // Show notification
  function showNotification(message) {
    notification.textContent = message;
    notification.classList.add('show');
    setTimeout(() => notification.classList.remove('show'), 3000);
  }

  // Check authentication
  async function checkAuth() {
    const { data: { session } } = await SupabaseClient.auth.getSession();
    if (!session) {
      window.location.href = '/login.html';
      return false;
    }
    currentUser = session.user;
    return true;
  }

  // Load room information
  async function loadRoom() {
    if (!roomCode) {
      window.location.href = '/app.html';
      return;
    }

    try {
      const { data: room, error } = await SupabaseClient
        .from('rooms')
        .select('*')
        .eq('code', roomCode)
        .eq('teacher_id', currentUser.id)
        .single();

      if (error || !room) {
        window.location.href = '/app.html';
        return;
      }

      currentRoom = room;
      roomCodeEl.textContent = room.code;

      // Update close/reopen button visibility
      if (room.active) {
        closeRoomBtn.style.display = 'inline-block';
        reopenRoomBtn.style.display = 'none';
      } else {
        closeRoomBtn.style.display = 'none';
        reopenRoomBtn.style.display = 'inline-block';
      }

      await loadStudents();
    } catch (error) {
      console.error('Error loading room:', error);
      window.location.href = '/app.html';
    }
  }

  // Load students
  async function loadStudents() {
    try {
      const { data: studentsData, error } = await SupabaseClient
        .from('students')
        .select('*')
        .eq('room_id', currentRoom.id);

      if (error) throw error;

      students = studentsData || [];
      renderStudents();
    } catch (error) {
      console.error('Error loading students:', error);
    }
  }

  // Render students
  function renderStudents() {
    if (students.length === 0) {
      studentList.innerHTML = `
        <div class="empty-state">
          <h3>No students yet</h3>
          <p>Share your room code with students. They'll appear here once they join with the Classcastle extension.</p>
        </div>
      `;
      studentCount.textContent = '0 joined';
      return;
    }

    studentList.innerHTML = students.map(student => `
      <div class="student-item ${student.online ? 'online' : ''}" data-student-id="${student.id}" data-student-name="${student.name}">
        <span class="student-name">${student.name}</span>
        <div class="student-status"></div>
      </div>
    `).join('');

    studentCount.textContent = `${students.length} joined`;

    // Add click handlers for kicking
    document.querySelectorAll('.student-item').forEach(item => {
      item.addEventListener('click', () => {
        const studentId = item.dataset.studentId;
        const studentName = item.dataset.studentName;
        kickStudent(studentId, studentName);
      });
    });
  }

  // Start room
  startBtn.addEventListener('click', () => {
    isStarted = true;
    startBtn.style.display = 'none';
    managementPanel.classList.add('active');
  });

  // Navigate students
  urlInput.addEventListener('input', () => {
    goBtn.disabled = !urlInput.value.trim();
  });

  goBtn.addEventListener('click', async () => {
    const url = urlInput.value.trim();
    if (!url) return;

    const btnText = goBtn.querySelector('.btn-text');
    const loading = goBtn.querySelector('.loading');

    goBtn.disabled = true;
    btnText.style.display = 'none';
    loading.style.display = 'inline-block';

    try {
      const { error } = await SupabaseClient
        .from('rooms')
        .update({ target_url: url })
        .eq('id', currentRoom.id);

      if (error) throw error;

      showNotification('Navigating students to ' + url);
      urlInput.value = '';
      goBtn.disabled = true;
    } catch (error) {
      console.error('Error navigating students:', error);
      showNotification('Error navigating students');
    } finally {
      goBtn.disabled = false;
      btnText.style.display = 'inline';
      loading.style.display = 'none';
    }
  });

  // Close room
  async function closeRoom() {
    if (!currentRoom) return;
    const confirmed = await showConfirm({
      title: 'Close Room',
      message: 'Are you sure you want to close this room? Students will no longer be able to join.',
      confirmText: 'Close Room',
      cancelText: 'Cancel'
    });
    if (!confirmed) return;

    try {
      const { error } = await SupabaseClient
        .from('rooms')
        .update({ active: false })
        .eq('id', currentRoom.id);

      if (error) throw error;

      currentRoom.active = false;
      closeRoomBtn.style.display = 'none';
      reopenRoomBtn.style.display = 'inline-block';
      showNotification('Room closed');
    } catch (error) {
      console.error('Error closing room:', error);
      showNotification('Error closing room');
    }
  }

  // Reopen room
  async function reopenRoom() {
    if (!currentRoom) return;

    try {
      const { error } = await SupabaseClient
        .from('rooms')
        .update({ active: true })
        .eq('id', currentRoom.id);

      if (error) throw error;

      currentRoom.active = true;
      closeRoomBtn.style.display = 'inline-block';
      reopenRoomBtn.style.display = 'none';
      showNotification('Room reopened');
    } catch (error) {
      console.error('Error reopening room:', error);
      showNotification('Error reopening room');
    }
  }

  // Kick student
  async function kickStudent(studentId, studentName) {
    const confirmed = await showConfirm({
      title: 'Kick Student',
      message: `Are you sure you want to kick ${studentName} from the room?`,
      confirmText: 'Kick',
      cancelText: 'Cancel'
    });
    if (!confirmed) return;

    try {
      const { error } = await SupabaseClient
        .from('students')
        .delete()
        .eq('id', studentId);

      if (error) throw error;

      students = students.filter(s => s.id !== studentId);
      renderStudents();
      showNotification(`${studentName} has been kicked`);
    } catch (error) {
      console.error('Error kicking student:', error);
      showNotification('Error kicking student');
    }
  }

  // Delete room
  async function deleteRoom() {
    if (!currentRoom) return;
    const confirmed = await showConfirm({
      title: 'Delete Room',
      message: 'Are you sure you want to delete this room? This will permanently remove all student data and cannot be undone.',
      confirmText: 'Delete',
      cancelText: 'Cancel'
    });
    if (!confirmed) return;

    try {
      const { error } = await SupabaseClient
        .from('rooms')
        .delete()
        .eq('id', currentRoom.id);

      if (error) throw error;

      showNotification('Room deleted');
      setTimeout(() => {
        window.location.href = '/app.html';
      }, 1000);
    } catch (error) {
      console.error('Error deleting room:', error);
      showNotification('Error deleting room');
    }
  }

  // Event listeners
  closeRoomBtn.addEventListener('click', closeRoom);
  reopenRoomBtn.addEventListener('click', reopenRoom);
  deleteRoomBtn.addEventListener('click', deleteRoom);

  // Initialize
  (async () => {
    const authenticated = await checkAuth();
    if (authenticated) {
      await loadRoom();
    }
  })();

  // Refresh students on visibility change
  document.addEventListener('visibilitychange', async () => {
    if (!document.hidden && currentRoom) {
      await loadStudents();
    }
  });
</script>
</body>
</html>
