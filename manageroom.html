<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classcastle — Manage Room</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #F7F6F1;
    --ink: #1C1B17;
    --ink-soft: #6B6A61;
    --line: #E2E0D6;
    --green: #2F5233;
    --green-soft: #E7EDE4;
    --amber: #D98E2B;
    --red: #B23A2E;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1C1B17;
      --ink: #F7F6F1;
      --ink-soft: #B8B7AE;
      --line: #3A3930;
      --green: #E7EDE4;
      --green-soft: #2F5233;
      --amber: #F0B84D;
      --red: #E86A5E;
    }
  }
  * { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; margin: 0; font-weight: 500; }
  p { margin: 0; }
  a { color: inherit; }

  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 28px 32px;
    max-width: 1080px; margin: 0 auto;
  }
  .wordmark { font-family: 'Fraunces', serif; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 9px; }
  .logo-mark { width: 24px; height: 24px; display: block; }
  .wordmark .word-accent { color: var(--green); }
  .nav-link {
    font-size: 0.88rem; font-weight: 500; color: var(--ink-soft);
    text-decoration: none;
  }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 32px; }

  .page-header {
    margin-bottom: 32px;
  }

  .page-title {
    font-size: clamp(1.8rem, 3vw, 2.2rem);
    letter-spacing: -0.015em;
    margin-bottom: 8px;
  }

  .page-subtitle {
    color: var(--ink-soft);
    font-size: 1rem;
  }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 32px;
    margin-bottom: 24px;
  }

  .room-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 24px;
  }

  .room-title {
    font-size: 1.3rem;
    letter-spacing: -0.01em;
  }

  .room-code-display {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .code-big {
    font-family: 'Fraunces', serif;
    font-size: 2.2rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--green);
  }

  .control-bar {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .url-input {
    flex: 1;
    padding: 12px 16px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.98rem;
    background: var(--paper);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .url-input:focus {
    border-color: var(--green);
    background: #fff;
  }

  .btn {
    padding: 12px 24px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.98rem;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
    border: none;
  }
  .btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  .btn:not(:disabled):active {
    transform: scale(0.98);
  }

  .btn-primary {
    background: var(--green);
    color: #fff;
  }

  .btn-secondary {
    background: var(--paper);
    color: var(--ink);
    border: 1.5px solid var(--line);
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .section-title {
    font-size: 1.15rem;
    letter-spacing: -0.01em;
  }

  .student-count {
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .student-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }

  .student-card {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color 0.15s ease;
  }
  .student-card.online {
    border-color: var(--green);
    background: var(--green-soft);
  }

  .student-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .student-card.online .student-avatar {
    background: var(--green);
    color: #fff;
  }

  .student-info {
    flex: 1;
    min-width: 0;
  }

  .student-name {
    font-size: 0.95rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .student-url {
    font-size: 0.8rem;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--line);
  }
  .student-card.online .status-dot {
    background: var(--green);
  }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--ink-soft);
  }
  .empty-state h3 {
    font-size: 1.1rem;
    margin-bottom: 8px;
  }
  .empty-state p {
    font-size: 0.92rem;
    line-height: 1.5;
  }

  .notification {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--ink);
    color: var(--paper);
    padding: 16px 20px;
    border-radius: 8px;
    font-size: 0.92rem;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
    z-index: 1000;
  }
  .notification.show {
    opacity: 1;
    transform: translateY(0);
  }

  .loading {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid var(--paper);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 780px) {
    nav { padding: 22px 24px; }
    .wrap { padding: 24px; }
    .room-header {
      flex-direction: column;
      gap: 16px;
    }
    .control-bar {
      flex-direction: column;
      align-items: stretch;
    }
    .student-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<nav>
  <div class="wordmark"><img src="/logo.svg" alt="" class="logo-mark"><span class="word-text">Class<span class="word-accent">castle</span></span></div>
  <a class="nav-link" href="/app.html">Back to dashboard</a>
</nav>

<div class="wrap">
  <div class="page-header">
    <h1 class="page-title">Manage Room</h1>
    <p class="page-subtitle" id="roomSubtitle">Loading room information...</p>
  </div>

  <div class="card">
    <div class="room-header">
      <div>
        <h2 class="room-title">Your room</h2>
        <p style="margin-top: 8px; color: var(--ink-soft); font-size: 0.92rem;">Share this code with your students</p>
      </div>
      <div class="room-code-display">
        <span class="code-big" id="roomCode">---</span>
        <button class="btn btn-secondary" id="closeRoomBtn">Close room</button>
      </div>
    </div>
    <div class="control-bar">
      <input type="url" class="url-input" id="urlInput" placeholder="Enter URL to send students to (e.g., https://microbit.org)">
      <button class="btn btn-primary" id="goBtn" disabled>
        <span class="btn-text">Go</span>
        <span class="loading" style="display: none;"></span>
      </button>
    </div>
  </div>

  <div class="card">
    <div class="section-header">
      <h2 class="section-title">Students in your room</h2>
      <span class="student-count" id="studentCount">0 joined</span>
    </div>
    <div class="student-grid" id="studentGrid">
      <div class="empty-state">
        <h3>No students yet</h3>
        <p>As a teacher, share your room code with students. They'll appear here once they join with the Classcastle extension.</p>
      </div>
    </div>
  </div>
</div>

<div class="notification" id="notification"></div>

<script>
  // Supabase configuration
  const SUPABASE_URL = 'https://hduyofdbpspjcuwvackd.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_zI1zwUpMhbnU1cMwRJBTug_or6athhK';
  
  const SupabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Switch favicon based on theme
  function updateFavicon() {
    const favicon = document.getElementById('favicon');
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    favicon.href = isDark ? '/logo-dark.svg' : '/logo.svg';
  }

  // Update favicon on load and when theme changes
  updateFavicon();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateFavicon);

  // Get room code from URL
  const urlParams = new URLSearchParams(window.location.search);
  const roomCode = urlParams.get('room');

  const notification = document.getElementById('notification');
  const roomCodeEl = document.getElementById('roomCode');
  const roomSubtitle = document.getElementById('roomSubtitle');
  const closeRoomBtn = document.getElementById('closeRoomBtn');
  const urlInput = document.getElementById('urlInput');
  const goBtn = document.getElementById('goBtn');
  const goBtnText = goBtn.querySelector('.btn-text');
  const goBtnLoading = goBtn.querySelector('.loading');
  const studentGrid = document.getElementById('studentGrid');
  const studentCount = document.getElementById('studentCount');

  let currentUser = null;
  let currentRoom = null;
  let students = [];
  let roomSubscription = null;

  function showNotification(message, duration = 3000) {
    notification.textContent = message;
    notification.classList.add('show');
    setTimeout(() => {
      notification.classList.remove('show');
    }, duration);
  }

  function renderStudents() {
    if (students.length === 0) {
      studentGrid.innerHTML = `
        <div class="empty-state">
          <h3>No students yet</h3>
          <p>As a teacher, share your room code with students. They'll appear here once they join with the Classcastle extension.</p>
        </div>
      `;
      studentCount.textContent = '0 joined';
      return;
    }

    studentGrid.innerHTML = students.map(student => `
      <div class="student-card online">
        <div class="student-avatar">${student.name.charAt(0)}</div>
        <div class="student-info">
          <div class="student-name">${student.name}</div>
          <div class="student-url">${student.current_url || 'Waiting for navigation'}</div>
        </div>
        <div class="status-dot"></div>
      </div>
    `).join('');

    studentCount.textContent = `${students.length} joined`;
  }

  function updateGoButton() {
    goBtn.disabled = !urlInput.value.trim() || students.length === 0;
  }

  async function validateRoomAccess() {
    if (!roomCode) {
      showNotification('No room code provided');
      window.location.href = '/app.html';
      return false;
    }

    try {
      const { data: { session } } = await SupabaseClient.auth.getSession();
      if (!session) {
        window.location.href = '/login.html';
        return false;
      }

      currentUser = session.user;

      // Check if room exists and belongs to current teacher
      const { data: room, error } = await SupabaseClient
        .from('rooms')
        .select('*')
        .eq('code', roomCode)
        .eq('teacher_id', currentUser.id)
        .single();

      if (error || !room) {
        showNotification('Room not found or access denied');
        window.location.href = '/app.html';
        return false;
      }

      currentRoom = room;
      roomCodeEl.textContent = room.code;
      roomSubtitle.textContent = `Room ${room.code} • ${new Date(room.created_at).toLocaleDateString()}`;
      
      if (room.target_url) {
        urlInput.value = room.target_url;
      }

      return true;
    } catch (error) {
      console.error('Error validating room access:', error);
      showNotification('Error loading room');
      window.location.href = '/app.html';
      return false;
    }
  }

  async function loadStudents() {
    if (!currentRoom) return;

    try {
      const { data, error } = await SupabaseClient
        .from('students')
        .select('*')
        .eq('room_id', currentRoom.id)
        .eq('online', true);

      if (error) throw error;

      students = data || [];
      renderStudents();
      updateGoButton();
    } catch (error) {
      console.error('Error loading students:', error);
    }
  }

  function subscribeToRoom() {
    if (roomSubscription) {
      roomSubscription.unsubscribe();
    }

    roomSubscription = SupabaseClient
      .channel(`room:${currentRoom.id}`)
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'students',
        filter: `room_id=eq.${currentRoom.id}`
      }, (payload) => {
        if (payload.eventType === 'INSERT') {
          students.push(payload.new);
          showNotification(`${payload.new.name} joined the room`);
        } else if (payload.eventType === 'UPDATE') {
          const index = students.findIndex(s => s.id === payload.new.id);
          if (index !== -1) {
            students[index] = payload.new;
          }
        } else if (payload.eventType === 'DELETE') {
          students = students.filter(s => s.id !== payload.old.id);
        }
        renderStudents();
        updateGoButton();
      })
      .subscribe();
  }

  async function navigateStudents() {
    const url = urlInput.value.trim();
    if (!url || !currentRoom || students.length === 0) return;

    // Show loading state
    goBtn.disabled = true;
    goBtnText.style.display = 'none';
    goBtnLoading.style.display = 'inline-block';

    try {
      const { error } = await SupabaseClient
        .from('rooms')
        .update({ target_url: url })
        .eq('id', currentRoom.id);

      if (error) throw error;

      currentRoom.target_url = url;
      showNotification(`Sent ${students.length} students to ${url}`);
    } catch (error) {
      console.error('Error navigating students:', error);
      showNotification('Error navigating students');
    } finally {
      // Reset button state
      goBtn.disabled = false;
      goBtnText.style.display = 'inline';
      goBtnLoading.style.display = 'none';
    }
  }

  async function closeRoom() {
    if (!currentRoom) return;
    if (!confirm('Are you sure you want to close this room? Students will no longer be able to join.')) return;

    try {
      const { error } = await SupabaseClient
        .from('rooms')
        .update({ active: false })
        .eq('id', currentRoom.id);

      if (error) throw error;

      showNotification('Room closed');
      setTimeout(() => {
        window.location.href = '/app.html';
      }, 1000);
    } catch (error) {
      console.error('Error closing room:', error);
      showNotification('Error closing room');
    }
  }

  // Event listeners
  urlInput.addEventListener('input', updateGoButton);
  urlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !goBtn.disabled) {
      navigateStudents();
    }
  });
  goBtn.addEventListener('click', navigateStudents);
  closeRoomBtn.addEventListener('click', closeRoom);

  // Handle visibility change for refresh
  document.addEventListener('visibilitychange', async () => {
    if (!document.hidden && currentRoom) {
      await loadStudents();
    }
  });

  // Initialize
  async function init() {
    const hasAccess = await validateRoomAccess();
    if (hasAccess) {
      subscribeToRoom();
      await loadStudents();
    }
  }

  init();
</script>

</body>
</html>
